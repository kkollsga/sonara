[package]
name = "sonara"
version = "0.3.3"
edition = "2021"
description = "High-performance audio analysis library for music information retrieval"
license = "MIT"
repository = "https://github.com/kkollsga/sonara"
readme = "../README.md"
keywords = ["audio", "music", "mir", "stft", "analysis"]
categories = ["multimedia::audio", "science"]

[dependencies]
ndarray = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
realfft = { workspace = true }
rustfft = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
symphonia = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
ferricml = { version = "0.1.2", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
blas-src = { version = "0.14", optional = true }

[features]
default = []
accelerate = ["ndarray/blas", "blas-src/accelerate"]
aggression = ["dep:ferricml", "dep:sha2"]
bench-internals = ["aggression"]

[dev-dependencies]
approx = { workspace = true }
criterion = "0.8"

[[bench]]
name = "bench_utils"
harness = false

[[bench]]
name = "bench_stft"
harness = false

[[bench]]
name = "bench_sequence"
harness = false

[[bench]]
name = "bench_cqt"
harness = false

[[bench]]
name = "bench_analyze"
harness = false

[[bench]]
name = "bench_aggression"
harness = false
required-features = ["aggression"]

[[bench]]
name = "bench_aggression_rates"
harness = false
required-features = ["aggression"]

[[bench]]
name = "bench_aggression_files"
harness = false
required-features = ["aggression"]

[[bench]]
name = "bench_aggression_allocations"
harness = false
required-features = ["aggression"]

[[bench]]
name = "bench_aggression_model"
harness = false
required-features = ["bench-internals"]
